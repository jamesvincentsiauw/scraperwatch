[project]
name = "scraperwatch"
version = "0.1.0.dev0"
description = "Catch scrapers that report success but return empty or incomplete data, before that data is published."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vincent Siauw", email = "jamesvincentsiauw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["scraping", "data-quality", "monitoring", "scrapy", "anomaly-detection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/jamesvincentsiauw/scraperwatch"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter handles line length; long finding messages read better unsplit.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
